{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Stepora Admin</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f7f7f7;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-container {
      background: #fff;
      padding: 2rem 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      width: 360px;
      text-align: center;
    }
    h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #2b2b2b;
    }
    input {
      width: 90%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      margin-bottom: 15px;
    }
    input:focus {
      border-color: #23c5b6;
    }
    .btn {
      width: 100%;
      background-color: #23c5b6;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 5px;
    }
    .btn:hover {
      background-color: #1fb3a6;
    }
    a {
      color: #23c5b6;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <img src="{% static 'images/logo.png' %}" width="70">
{% if messages %}
  <div style="background:#ffe1e1; padding:10px; border-radius:6px; margin-bottom:15px; color:#b30000; font-size:14px;">
    {% for message in messages %}
      {{ message }}
    {% endfor %}
  </div>
{% endif %}

    <h2>Forgot Password</h2>

    <form method="POST">
      {% csrf_token %}
      <input type="email" name="email" placeholder="Enter your email" required>
      <button type="submit" class="btn">Send OTP</button>
    </form>

    <p style="margin-top:12px;">
      <a href="{% url 'admin_login' %}">Back to Login</a>
    </p>
  </div>
</body>
</html>
