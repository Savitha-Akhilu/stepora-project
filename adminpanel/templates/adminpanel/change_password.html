{% extends "adminpanel/base.html" %}
{% load static %}

{% block content %}

<div class="container mt-4">

  <div class="card shadow-sm" style="max-width: 500px; margin: auto;">
    <div class="card-body">

      <h4 class="mb-3" style="font-weight: 600; text-align:center;">Change Password</h4>

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label">Old Password</label>
          <input type="password" name="old_password" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">New Password</label>
<input type="password" id="new_password" name="password1" class="form-control" required>        </div>

<div class="mb-3">
  <label class="form-label">Confirm New Password</label>
  <input type="password" id="confirm_password" name="password2" class="form-control" required>
  <small id="password_error" style="color: red; display: none;">Passwords do not match.</small>
</div>

        <button type="submit" class="btn w-100" style="background:#23c5b6; color:white;">
          Update Password
        </button>
      </form>

    </div>
  </div>

</div>
<script>
  const newPwd = document.getElementById("new_password");
  const confirmPwd = document.getElementById("confirm_password");
  const errorText = document.getElementById("password_error");

  function checkPasswordMatch() {
      if (confirmPwd.value === "") {
          confirmPwd.style.borderColor = "#ddd";
          errorText.style.display = "none";
          return;
      }

      if (newPwd.value === confirmPwd.value) {
          confirmPwd.style.borderColor = "green";
          errorText.style.display = "none";
      } else {
          confirmPwd.style.borderColor = "red";
          errorText.style.display = "block";
      }
  }

  newPwd.addEventListener("input", checkPasswordMatch);
  confirmPwd.addEventListener("input", checkPasswordMatch);
</script>

{% endblock %}
