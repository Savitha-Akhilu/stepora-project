{% extends "adminpanel/base.html" %}
{% block content %}
<div class="container-fluid col-md-6">
  <h4>Edit Brand</h4>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Brand Name</label>
      <input type="text" name="name" value="{{ brand.name }}" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea name="description" class="form-control" rows="3">{{ brand.description }}</textarea>
    </div>
    <button type="submit" class="btn btn-success">Update</button>
    <a href="{% url 'admin_brands' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
