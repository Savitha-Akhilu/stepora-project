{% extends 'user_section/base.html' %}
{% load static %}

{% block content %}
<div class="text-center mt-5">
  <img src="{% static 'images/payment_faild.jpg' %}" alt="Payment Failed" width="200">
  <h3 class="text-danger mt-3">Payment could not be completed</h3>
  <p class="text-muted">There was a problem processing your payment. You can try again or view your order details.</p>

  <div class="mt-4">
    <a href="{% url 'cart:retry_payment' order_id=order.id %}" class="btn btn-primary me-2">Retry Payment</a>
    <a href="{% url 'cart:order_detail' order_id=order.id %}" class="btn btn-outline-secondary">View Order Details</a>
  </div>
</div>
{% endblock %}
