<script>
  document.addEventListener("DOMContentLoaded", function () {
    const userMenu = document.querySelector(".user-menu");
    const dropdown = document.querySelector(".user-dropdown");

    // Toggle dropdown when user icon is clicked
    userMenu.addEventListener("click", function (e) {
      e.stopPropagation();
      dropdown.classList.toggle("show");
    });

    // Close dropdown when clicking anywhere outside
    document.addEventListener("click", function () {
      dropdown.classList.remove("show");
    });
  });
</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('search-input');
  const resultsDiv = document.getElementById('search-results');

  input.addEventListener('keyup', function () {
    const query = this.value.trim();
    if (query.length < 2) {
      resultsDiv.style.display = 'none';
      return;
    }

    fetch(`/search/?q=${encodeURIComponent(query)}`)
      .then(response => response.json())
      .then(data => {
        resultsDiv.innerHTML = '';
        if (data.results.length > 0) {
          data.results.forEach(item => {
            const resultItem = document.createElement('a');
            resultItem.href = item.url;
            resultItem.className = 'list-group-item list-group-item-action d-flex align-items-center';
            resultItem.innerHTML = `
              <img src="${item.image}" width="40" height="40" class="me-2 rounded">
              <span>${item.name}</span>
            `;
            resultsDiv.appendChild(resultItem);
          });
        } else {
          resultsDiv.innerHTML = '<div class="list-group-item">No products found</div>';
        }
        resultsDiv.style.display = 'block';
      });
  });

  document.addEventListener('click', (e) => {
    if (!resultsDiv.contains(e.target) && e.target !== input) {
      resultsDiv.style.display = 'none';
    }
  });
});
</script>
