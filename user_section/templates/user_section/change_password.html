{% extends 'user_section/profile_base.html' %}
{% load static %}

{% block profile_content %}
<link rel="stylesheet" href="{% static 'css/profile.css' %}">

<div class="profile-card">
  <h5 class="mb-4">Change Password</h5>

  <form id="changePasswordForm">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Current Password</label>
      <input type="password" class="form-control" name="current_password" required>
    </div>
    <div class="mb-3">
      <label class="form-label">New Password</label>
      <input type="password" class="form-control" name="new_password" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Confirm New Password</label>
      <input type="password" class="form-control" name="confirm_password" required>
    </div>

    <div class="text-center mt-4">
      <button type="submit" class="btn btn-black">Change Password</button>
      <a href="{% url 'user_profile' %}" class="btn btn-secondary ms-2">Cancel</a>
    </div>
  </form>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("changePasswordForm");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const formData = new FormData(form);

    const response = await fetch("{% url 'change_password' %}", {
      method: "POST",
      headers: { "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value },
      body: formData
    });

    const data = await response.json();

    if (data.status === "success") {
      alert("✅ " + data.message);
      form.reset();
    } else {
      alert("❌ " + data.message);
    }
  });
});
</script>
{% endblock %}
