{% extends 'user_section/profile_base.html' %}
{% load static %}

{% block profile_content %}
<link rel="stylesheet" href="{% static 'css/profile.css' %}">

<div class="profile-card">
  <h5 class="mb-4">Edit Address</h5>

  <form method="POST" id="editAddressForm">
    {% csrf_token %}
    <input type="hidden" name="address_id" value="{{ address.id }}">

    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" name="full_name" value="{{ address.full_name }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Phone Number</label>
        <input type="text" class="form-control" name="mobile" value="{{ address.mobile }}" required>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">Pincode</label>
        <input type="text" class="form-control" name="pincode" value="{{ address.pincode }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">State</label>
        <input type="text" class="form-control" name="state" value="{{ address.state }}" required>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">City / District</label>
        <input type="text" class="form-control" name="city" value="{{ address.city }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Locality / Town</label>
        <input type="text" class="form-control" name="locality" value="{{ address.locality }}" required>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">House / Building Name</label>
      <input type="text" class="form-control" name="house_name" value="{{ address.house_name }}" required>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">Type of Address</label>
        <div class="d-flex gap-3">
          <label><input type="radio" name="address_type" value="Home" {% if address.address_type == "Home" %}checked{% endif %}> Home</label>
          <label><input type="radio" name="address_type" value="Office" {% if address.address_type == "Office" %}checked{% endif %}> Office</label>
        </div>
      </div>
      <div class="col-md-6 d-flex align-items-center">
        <label class="form-check-label">
          <input type="checkbox" class="form-check-input" name="is_default" {% if address.is_default %}checked{% endif %}>
          Make this my default address
        </label>
      </div>
    </div>

    <div class="text-center mt-4">
      <button type="submit" class="btn btn-black">Save Changes</button>
      <a href="{% url 'user_address' %}" class="btn btn-secondary ms-2">Cancel</a>
    </div>
  </form>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("editAddressForm");
  const pincodeInput = form.querySelector("[name=pincode]");
  const stateInput = form.querySelector("[name=state]");
  const cityInput = form.querySelector("[name=city]");
// 🚫 Prevent Enter key from auto-submitting the form
form.addEventListener("keypress", (e) => {
  if (e.key === "Enter") {
    e.preventDefault(); // stop default submit
  }
});

  // --- 🔄 Auto-fill State & District when pincode changes ---
  pincodeInput.addEventListener("input", async () => {
    const pin = pincodeInput.value.trim();

    // ✅ Only trigger if 6 digits
    if (pin.length === 6) {
      try {
        const res = await fetch(`https://api.postalpincode.in/pincode/${pin}`);
        const data = await res.json();

        if (data[0].Status === "Success") {
          const info = data[0].PostOffice[0];
          stateInput.value = info.State;
          cityInput.value = info.District;
        } else {
          alert("❌ Invalid Pincode! Please enter a valid one.");
          stateInput.value = "";
          cityInput.value = "";
        }
      } catch (err) {
        console.error("Error fetching pincode info:", err);
        alert("⚠️ Unable to fetch details. Please fill manually.");
      }
    }
  });

  // --- 💾 Save Form via AJAX ---
  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const formData = new FormData(form);
    const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;

    try {
      const response = await fetch("{% url 'edit_address' address.id %}", {
        method: "POST",
        headers: { "X-CSRFToken": csrfToken },
        body: formData
      });

      const data = await response.json();

      if (data.status === "success") {
        alert("✅ Address updated successfully!");
        window.location.href = "{% url 'user_address' %}";
      } else {
        alert("❌ " + data.message);
      }
    } catch (err) {
      console.error("Error:", err);
      alert("⚠️ Something went wrong while updating the address.");
    }
  });
});
</script>
{% endblock %}
