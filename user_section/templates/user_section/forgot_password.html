{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Stepora</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #ffffff;
      font-family: 'Poppins', sans-serif;
      color: #111;
    }

    .forgot-section {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 70vh;
    }

    .forgot-box {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      width: 360px;
      padding: 40px 30px;
      text-align: center;
    }

    .forgot-box h2 {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    label {
      font-size: 0.9rem;
      color: #333;
      display: block;
      text-align: left;
      margin-bottom: 6px;
    }

    input[type="email"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: 0.3s;
      margin-bottom: 18px;
    }

    input[type="email"]:focus {
      border-color: #6ec3b0;
      box-shadow: 0 0 5px #bce7de;
    }

    .login-btn {
      width: 100%;
      background: #6ec3b0;
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-btn:hover {
      background: #5ab09c;
    }

    .alert {
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .alert-success {
      background-color: #d4edda;
      color: #155724;
    }

    .alert-error {
      background-color: #f8d7da;
      color: #721c24;
    }

    @media (max-width: 480px) {
      .forgot-box {
        width: 90%;
        padding: 30px 20px;
      }
    }
  </style>
</head>

<body>
  {% include 'user_section/header.html' %}

  <section class="forgot-section">
    <div class="forgot-box">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <h2>Forgot Password ?</h2>
      <form method="POST">
        {% csrf_token %}
        <label>Enter your registered email</label>
        <input type="email" name="email" placeholder="helloworld@gmail.com" required>
        <button type="submit" class="login-btn">Verify Email</button>
      </form>
    </div>
  </section>

  {% include 'user_section/authentication_footer.html' %}

  <script>
    // Auto fade alert after 3s
    setTimeout(() => {
      document.querySelectorAll('.alert').forEach(alert => {
        alert.style.transition = "opacity 0.6s ease";
        alert.style.opacity = "0";
        setTimeout(() => alert.remove(), 600);
      });
    }, 3000);
  </script>
</body>
</html>
